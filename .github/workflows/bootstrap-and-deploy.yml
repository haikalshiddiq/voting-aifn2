name: Bootstrap and Deploy AiFn2 PWA

on:
  workflow_dispatch:
    inputs:
      turnstile_site_key:
        description: "Turnstile Site Key produksi"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: voting-aifn2-production
  cancel-in-progress: false

jobs:
  bootstrap-and-deploy:
    name: Bootstrap and Deploy AiFn2 PWA
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      TURNSTILE_SITE_KEY: ${{ inputs.turnstile_site_key }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "package.json"
            "wrangler.jsonc"
            "src/index.js"
            "src/eligible.json"
            "public/index.html"
            "public/admin.html"
            "public/manifest.webmanifest"
            "public/sw.js"
            "migrations/0001_init.sql"
            "scripts/bootstrap_d1.py"
            "scripts/patch.py"
            "scripts/qa.mjs"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::File tidak ditemukan: $file"
              exit 1
            fi
          done

          echo "Semua file aplikasi tersedia."

      - name: Validate secrets and workflow input
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Secret CLOUDFLARE_ACCOUNT_ID belum tersedia."
            exit 1
          fi

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN belum tersedia."
            exit 1
          fi

          if [ -z "${ADMIN_KEY:-}" ]; then
            echo "::error::Secret ADMIN_KEY belum tersedia."
            exit 1
          fi

          if [ -z "${TURNSTILE_SECRET_KEY:-}" ]; then
            echo "::error::Secret TURNSTILE_SECRET_KEY belum tersedia."
            exit 1
          fi

          if [ -z "${TURNSTILE_SITE_KEY:-}" ]; then
            echo "::error::Turnstile Site Key belum diisi."
            exit 1
          fi

          if [ "${#ADMIN_KEY}" -lt 32 ]; then
            echo "::error::ADMIN_KEY harus memiliki minimal 32 karakter."
            exit 1
          fi

          echo "Semua secrets dan input tersedia."

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          npm install \
            --no-audit \
            --no-fund

      - name: Normalize Wrangler configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 -c "import json,pathlib; p=pathlib.Path('wrangler.jsonc'); c=json.loads(p.read_text(encoding='utf-8')); c.update({'name':'voting-aifn2','compatibility_date':'2026-11-11','workers_dev':True}); p.write_text(json.dumps(c,indent=2)+'\n',encoding='utf-8')"

          echo "Konfigurasi Wrangler telah dinormalisasi."

      - name: Create or locate AiFn2 D1 database
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/bootstrap_d1.py

      - name: Validate D1 configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 -c "import json; c=json.load(open('wrangler.jsonc',encoding='utf-8')); d=c.get('d1_databases',[]); assert len(d)==1, 'Harus tersedia tepat satu database D1'; assert d[0].get('binding')=='DB', 'Binding D1 harus bernama DB'; assert d[0].get('database_name')=='voting-aifn2', 'Database harus bernama voting-aifn2'; assert d[0].get('database_id') not in ('','REPLACE_WITH_D1_DATABASE_ID'), 'D1 database_id belum terpasang'; print('D1 siap:',d[0]['database_id'])"

      - name: Configure Turnstile Site Key
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/patch.py \
            "$TURNSTILE_SITE_KEY"

      - name: Validate AiFn2 roster
        shell: bash
        run: |
          set -euo pipefail

          python3 -c "import json; e=json.load(open('src/eligible.json',encoding='utf-8')); assert len(e)==40, 'Roster harus berisi tepat 40 mahasiswa'; assert len({x['nim'] for x in e})==40, 'Terdapat NIM duplikat'; assert not any(x['nim']=='25140200001' for x in e), 'RUDI HARTANTO masih masuk roster'; assert any(x['nim']=='25110200005' for x in e), 'HELMI RIYADHOH belum masuk roster'; assert any(x['nim']=='25110200003' for x in e), 'RINI YANTI belum masuk roster'; print('Roster valid: 40 mahasiswa eligible')"

      - name: Validate voting deadline
        shell: bash
        run: |
          set -euo pipefail

          python3 -c "from pathlib import Path; w=Path('src/index.js').read_text(encoding='utf-8'); assert '2026-11-12T15:00:00.000Z' in w, 'Deadline Worker tidak sesuai'; print('Deadline valid: Kamis, 12 November 2026 pukul 22.00 WIB')"

      - name: Validate final voting fix
        shell: bash
        run: |
          set -euo pipefail

          python3 -c "from pathlib import Path; w=Path('src/index.js').read_text(encoding='utf-8'); h=Path('public/index.html').read_text(encoding='utf-8'); sw=Path('public/sw.js').read_text(encoding='utf-8'); vote=w[w.index(\"u.pathname==='/api/vote'\"):w.index(\"u.pathname==='/api/admin'\")]; assert 'await TS(' not in vote, 'Endpoint vote masih meminta Turnstile kedua'; assert 'TTL=900000' in w, 'TTL sesi belum 15 menit'; assert 'id=\"sendVote\"' in h, 'Tombol Kirim suara tidak ditemukan'; assert \"body:JSON.stringify({token:T,candidateNim:nim})\" in h, 'Payload vote belum diperbaiki'; assert 'aifn2-v6-vote-submit-stable' in sw, 'Versi cache PWA belum diperbarui'; print('Final voting fix valid')"

      - name: Run application QA
        shell: bash
        run: |
          set -euo pipefail

          npm run qa
          node --check src/index.js

      - name: Apply D1 migrations
        shell: bash
        run: |
          set -euo pipefail

          npx wrangler d1 migrations apply \
            voting-aifn2 \
            --remote

      - name: Upload shared ADMIN_KEY
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$ADMIN_KEY" |
            npx wrangler secret put ADMIN_KEY

      - name: Upload Turnstile Secret Key
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$TURNSTILE_SECRET_KEY" |
            npx wrangler secret put \
              TURNSTILE_SECRET_KEY

      - name: Deploy voting-aifn2 Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          rm -f wrangler-deploy.log

          npx wrangler deploy 2>&1 |
            tee wrangler-deploy.log

          DEPLOY_EXIT="${PIPESTATUS[0]}"

          if [ "$DEPLOY_EXIT" -ne 0 ]; then
            echo "::error::wrangler deploy gagal dengan exit code $DEPLOY_EXIT."
            exit "$DEPLOY_EXIT"
          fi

          WORKER_URL=$(
            grep -Eo \
              'https://[A-Za-z0-9.-]+\.workers\.dev' \
              wrangler-deploy.log |
            grep -v '\.preview\.' |
            head -n 1 || true
          )

          if [ -z "${WORKER_URL:-}" ]; then
            WORKER_URL="https://voting-aifn2.hicall.workers.dev"

            echo "::warning::URL tidak ditemukan pada output Wrangler. Menggunakan URL produksi yang dikonfigurasi."
          fi

          WORKER_URL="${WORKER_URL%/}"

          echo "worker_url=$WORKER_URL" \
            >> "$GITHUB_OUTPUT"

          echo ""
          echo "Worker berhasil di-deploy:"
          echo "$WORKER_URL"

      - name: Record deployment evidence
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s wrangler-deploy.log ]; then
            echo "::error::Log deployment kosong atau tidak tersedia."
            exit 1
          fi

          echo "Ringkasan deployment:"
          tail -n 40 wrangler-deploy.log

          echo ""
          echo "Perintah wrangler deploy selesai dengan exit code 0."

      - name: Optional workers.dev health check
        continue-on-error: true
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set +e

          rm -f api-config.json

          echo "Memeriksa endpoint:"
          echo "${WORKER_URL}/api/config"

          HTTP_CODE=$(
            curl \
              --silent \
              --show-error \
              --location \
              --connect-timeout 10 \
              --max-time 30 \
              --retry 2 \
              --retry-delay 5 \
              --retry-all-errors \
              --output api-config.json \
              --write-out "%{http_code}" \
              --header "Accept: application/json" \
              --header "Cache-Control: no-cache" \
              --user-agent \
              "Voting-AiFn2-Health-Check/2.0" \
              "${WORKER_URL}/api/config"
          )

          CURL_EXIT=$?

          echo ""
          echo "curl exit code: $CURL_EXIT"
          echo "HTTP status: $HTTP_CODE"

          if [ -f api-config.json ]; then
            echo ""
            echo "Response:"
            cat api-config.json
            echo ""
          fi

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::warning::GitHub runner tidak dapat menjangkau workers.dev. Deployment tetap berhasil berdasarkan wrangler deploy."
            exit 0
          fi

          if [ "$HTTP_CODE" != "200" ]; then
            if grep -q \
              "error code: 1042" \
              api-config.json \
              2>/dev/null; then

              echo "::warning::Cloudflare workers.dev mengembalikan error 1042. Deployment tidak digagalkan."
              exit 0
            fi

            echo "::warning::Endpoint mengembalikan HTTP $HTTP_CODE. Deployment tidak digagalkan."
            exit 0
          fi

          python3 -c "import json; d=json.load(open('api-config.json',encoding='utf-8')); c=d.get('candidates',[]); assert len(c)==40, 'Jumlah kandidat harus tepat 40'; assert len({x.get('nim') for x in c})==40, 'Terdapat NIM kandidat duplikat'; assert not any(x.get('nim')=='25140200001' for x in c), 'Mahasiswa Fast-Track masih terdaftar'; assert any(x.get('nim')=='25110200005' for x in c), 'HELMI RIYADHOH belum terdaftar'; assert any(x.get('nim')=='25110200003' for x in c), 'RINI YANTI belum terdaftar'; assert d.get('deadline')=='2026-11-12T15:00:00.000Z', 'Deadline server tidak sesuai'; print('Health check berhasil: 40 kandidat, Fast-Track dikecualikan')"

          exit 0

      - name: Show production URLs
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail

          echo "## Deployment AiFn2 berhasil" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- Pemilih dan kandidat eligible: 40 mahasiswa" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- Fast-Track dikecualikan: RUDI HARTANTO, 25140200001" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- Deadline: Kamis, 12 November 2026 pukul 22.00 WIB" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- Halaman mahasiswa: ${WORKER_URL}" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- Halaman admin: ${WORKER_URL}/admin.html" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- API konfigurasi: ${WORKER_URL}/api/config" \
            >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "Halaman mahasiswa:"
          echo "$WORKER_URL"

          echo ""
          echo "Halaman admin:"
          echo "${WORKER_URL}/admin.html"

          echo ""
          echo "API konfigurasi:"
          echo "${WORKER_URL}/api/config"

      - name: Commit generated D1 configuration
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add wrangler.jsonc

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan konfigurasi yang perlu disimpan."
          else
            git commit \
              -m "chore: configure AiFn2 Cloudflare D1"

            git push origin HEAD:main
          fi
