name: Bootstrap and Deploy AiFn2 PWA

on:
  workflow_dispatch:
    inputs:
      turnstile_site_key:
        description: "Turnstile Site Key produksi"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: deploy-voting-aifn2
  cancel-in-progress: false

jobs:
  bootstrap-and-deploy:
    name: Bootstrap and Deploy AiFn2 PWA
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      TURNSTILE_SITE_KEY: ${{ inputs.turnstile_site_key }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "package.json"
            "wrangler.jsonc"
            "src/index.js"
            "src/eligible.json"
            "public/index.html"
            "public/admin.html"
            "public/manifest.webmanifest"
            "public/sw.js"
            "migrations/0001_init.sql"
            "scripts/bootstrap_d1.py"
            "scripts/patch.py"
            "scripts/qa.mjs"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::File wajib tidak ditemukan: $file"
              exit 1
            fi
          done

          echo "Semua file aplikasi tersedia."

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Secret CLOUDFLARE_ACCOUNT_ID belum tersedia."
            exit 1
          fi

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN belum tersedia."
            exit 1
          fi

          if [ -z "${ADMIN_KEY:-}" ]; then
            echo "::error::Secret ADMIN_KEY belum tersedia."
            exit 1
          fi

          if [ -z "${TURNSTILE_SECRET_KEY:-}" ]; then
            echo "::error::Secret TURNSTILE_SECRET_KEY belum tersedia."
            exit 1
          fi

          if [ -z "${TURNSTILE_SITE_KEY:-}" ]; then
            echo "::error::Turnstile Site Key belum diisi."
            exit 1
          fi

          if [ "${#ADMIN_KEY}" -lt 32 ]; then
            echo "::error::ADMIN_KEY harus memiliki minimal 32 karakter."
            exit 1
          fi

          echo "Semua secrets dan input workflow tersedia."

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          npm install \
            --no-audit \
            --no-fund

      - name: Normalize Wrangler compatibility date
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("wrangler.jsonc")
          config = json.loads(path.read_text(encoding="utf-8"))

          config["compatibility_date"] = "2026-11-11"

          path.write_text(
              json.dumps(
                  config,
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          print(
              "compatibility_date:",
              config["compatibility_date"],
          )

      - name: Create or locate AiFn2 D1 database
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/bootstrap_d1.py

      - name: Validate D1 configuration
        shell: python
        run: |
          import json
          from pathlib import Path

          config = json.loads(
              Path("wrangler.jsonc").read_text(
                  encoding="utf-8"
              )
          )

          databases = config.get("d1_databases", [])

          if len(databases) != 1:
              raise SystemExit(
                  "Harus tersedia tepat satu D1 database."
              )

          database = databases[0]

          if database.get("binding") != "DB":
              raise SystemExit(
                  "D1 binding harus bernama DB."
              )

          if database.get("database_name") != "voting-aifn2":
              raise SystemExit(
                  "D1 database harus bernama voting-aifn2."
              )

          database_id = database.get("database_id", "")

          if not database_id:
              raise SystemExit(
                  "D1 database_id masih kosong."
              )

          if database_id == "REPLACE_WITH_D1_DATABASE_ID":
              raise SystemExit(
                  "D1 database_id masih berupa placeholder."
              )

          print("D1 database ID:", database_id)

      - name: Configure Turnstile Site Key
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/patch.py \
            "$TURNSTILE_SITE_KEY"

