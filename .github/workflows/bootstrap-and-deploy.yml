name: Bootstrap and Deploy AiFn2 PWA

on:
  workflow_dispatch:
    inputs:
      turnstile_site_key:
        description: "Turnstile Site Key produksi"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: voting-aifn2-production
  cancel-in-progress: false

jobs:
  bootstrap-and-deploy:
    name: Bootstrap and Deploy AiFn2 PWA
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      TURNSTILE_SITE_KEY: ${{ inputs.turnstile_site_key }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "package.json"
            "wrangler.jsonc"
            "src/index.js"
            "src/eligible.json"
            "public/index.html"
            "public/admin.html"
            "public/manifest.webmanifest"
            "public/sw.js"
            "migrations/0001_init.sql"
            "scripts/bootstrap_d1.py"
            "scripts/patch.py"
            "scripts/qa.mjs"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::File wajib tidak ditemukan: $file"
              exit 1
            fi
          done

          echo "Semua file aplikasi tersedia."

      - name: Validate secrets and workflow input
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Secret CLOUDFLARE_ACCOUNT_ID belum tersedia."
            exit 1
          fi

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN belum tersedia."
            exit 1
          fi

          if [ -z "${ADMIN_KEY:-}" ]; then
            echo "::error::Secret ADMIN_KEY belum tersedia."
            exit 1
          fi

          if [ -z "${TURNSTILE_SECRET_KEY:-}" ]; then
            echo "::error::Secret TURNSTILE_SECRET_KEY belum tersedia."
            exit 1
          fi

          if [ -z "${TURNSTILE_SITE_KEY:-}" ]; then
            echo "::error::Turnstile Site Key belum diisi."
            exit 1
          fi

          if [ "${#ADMIN_KEY}" -lt 32 ]; then
            echo "::error::ADMIN_KEY harus memiliki minimal 32 karakter."
            exit 1
          fi

          echo "Secrets dan input workflow tersedia."

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          npm install \
            --no-audit \
            --no-fund

      - name: Normalize Wrangler configuration
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("wrangler.jsonc")

          config = json.loads(
              path.read_text(encoding="utf-8")
          )

          config["name"] = "voting-aifn2"
          config["compatibility_date"] = "2026-11-11"
          config["workers_dev"] = True

          path.write_text(
              json.dumps(
                  config,
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          print("Worker name:", config["name"])
          print(
              "Compatibility date:",
              config["compatibility_date"],
          )
          print(
              "workers_dev:",
              config["workers_dev"],
          )

      - name: Create or locate AiFn2 D1 database
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/bootstrap_d1.py

      - name: Validate D1 configuration
        shell: python
        run: |
          import json
          from pathlib import Path

          config = json.loads(
              Path("wrangler.jsonc").read_text(
                  encoding="utf-8"
              )
          )

          databases = config.get(
              "d1_databases",
              [],
          )

          if len(databases) != 1:
              raise SystemExit(
                  "Harus tersedia tepat satu D1 database."
              )

          database = databases[0]

          if database.get("binding") != "DB":
              raise SystemExit(
                  "D1 binding harus bernama DB."
              )

          if (
              database.get("database_name")
              != "voting-aifn2"
          ):
              raise SystemExit(
                  "D1 database harus bernama voting-aifn2."
              )

          database_id = database.get(
              "database_id",
              "",
          )

          if not database_id:
              raise SystemExit(
                  "D1 database_id masih kosong."
              )

          if (
              database_id
              == "REPLACE_WITH_D1_DATABASE_ID"
          ):
              raise SystemExit(
                  "D1 database_id masih berupa placeholder."
              )

          print("D1 database ID:", database_id)

      - name: Configure Turnstile Site Key
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/patch.py \
            "$TURNSTILE_SITE_KEY"

      - name: Validate Turnstile configuration
        shell: python
        run: |
          import json
          from pathlib import Path

          config = json.loads(
              Path("wrangler.jsonc").read_text(
                  encoding="utf-8"
              )
          )

          site_key = (
              config
              .get("vars", {})
              .get("TURNSTILE_SITE_KEY", "")
          )

          if not site_key:
              raise SystemExit(
                  "TURNSTILE_SITE_KEY kosong."
              )

          if (
              site_key
              == "1x00000000000000000000AA"
          ):
              raise SystemExit(
                  "Turnstile masih memakai test Site Key."
              )

          print(
              "Turnstile Site Key:",
              site_key[:8]
              + "..."
              + site_key[-4:],
          )

      - name: Run application QA
        shell: bash
        run: |
          set -euo pipefail

          npm run qa

      - name: Check Worker JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          node --check src/index.js

      - name: Apply D1 migrations
        shell: bash
        run: |
          set -euo pipefail

          npx wrangler d1 migrations apply \
            voting-aifn2 \
            --remote

      - name: Upload shared ADMIN_KEY
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$ADMIN_KEY" |
            npx wrangler secret put ADMIN_KEY

      - name: Upload Turnstile Secret Key
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$TURNSTILE_SECRET_KEY" |
            npx wrangler secret put \
              TURNSTILE_SECRET_KEY

      - name: Deploy voting-aifn2 Worker
        id: deploy
