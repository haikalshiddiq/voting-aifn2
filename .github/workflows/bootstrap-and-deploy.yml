name: Bootstrap and Deploy AiFn2 PWA

on:
  workflow_dispatch:
    inputs:
      turnstile_site_key:
        description: "Turnstile Site Key produksi"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: voting-aifn2-production
  cancel-in-progress: false

jobs:
  bootstrap-and-deploy:
    name: Bootstrap and Deploy AiFn2 PWA
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      TURNSTILE_SITE_KEY: ${{ inputs.turnstile_site_key }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "package.json"
            "wrangler.jsonc"
            "src/index.js"
            "src/eligible.json"
            "public/index.html"
            "public/admin.html"
            "public/manifest.webmanifest"
            "public/sw.js"
            "migrations/0001_init.sql"
            "scripts/bootstrap_d1.py"
            "scripts/patch.py"
            "scripts/qa.mjs"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::File tidak ditemukan: $file"
              exit 1
            fi
          done

          echo "Semua file aplikasi tersedia."

      - name: Validate secrets and workflow input
        shell: bash
        run: |
          set -euo pipefail

          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || {
            echo "::error::Secret CLOUDFLARE_ACCOUNT_ID belum tersedia."
            exit 1
          }

          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo "::error::Secret CLOUDFLARE_API_TOKEN belum tersedia."
            exit 1
          }

          test -n "${ADMIN_KEY:-}" || {
            echo "::error::Secret ADMIN_KEY belum tersedia."
            exit 1
          }

          test -n "${TURNSTILE_SECRET_KEY:-}" || {
            echo "::error::Secret TURNSTILE_SECRET_KEY belum tersedia."
            exit 1
          }

          test -n "${TURNSTILE_SITE_KEY:-}" || {
            echo "::error::Turnstile Site Key belum diisi."
            exit 1
          }

          if [ "${#ADMIN_KEY}" -lt 32 ]; then
            echo "::error::ADMIN_KEY harus memiliki minimal 32 karakter."
            exit 1
          fi

          echo "Semua secrets dan input workflow tersedia."

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund

      - name: Normalize Wrangler configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 -c "
          import json
          from pathlib import Path

          path = Path('wrangler.jsonc')
          config = json.loads(path.read_text(encoding='utf-8'))

          config['name'] = 'voting-aifn2'
          config['compatibility_date'] = '2026-11-11'
          config['workers_dev'] = True

          path.write_text(
              json.dumps(
                  config,
                  ensure_ascii=False,
                  indent=2
              ) + '\n',
              encoding='utf-8'
          )

          print('Worker name:', config['name'])
          print(
              'Compatibility date:',
              config['compatibility_date']
          )
          print('workers_dev:', config['workers_dev'])
          "

      - name: Create or locate AiFn2 D1 database
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/bootstrap_d1.py

      - name: Validate D1 configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 -c "
          import json
          from pathlib import Path

          config = json.loads(
              Path('wrangler.jsonc').read_text(
                  encoding='utf-8'
              )
          )

          databases = config.get('d1_databases', [])

          if len(databases) != 1:
              raise SystemExit(
                  'Harus tersedia tepat satu database D1.'
              )

          database = databases[0]

          if database.get('binding') != 'DB':
              raise SystemExit(
                  'D1 binding harus bernama DB.'
              )

          if (
              database.get('database_name')
              != 'voting-aifn2'
          ):
              raise SystemExit(
                  'Database D1 harus bernama voting-aifn2.'
              )

          database_id = database.get(
              'database_id',
              ''
          )

          if not database_id:
              raise SystemExit(
                  'D1 database_id masih kosong.'
              )

          if (
              database_id
              == 'REPLACE_WITH_D1_DATABASE_ID'
          ):
              raise SystemExit(
                  'D1 database_id masih berupa placeholder.'
              )

          print('D1 database ID:', database_id)
          "

      - name: Configure Turnstile Site Key
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch.py "$TURNSTILE_SITE_KEY"

      - name: Validate Turnstile configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 -c "
          import json
          from pathlib import Path

          config = json.loads(
              Path('wrangler.jsonc').read_text(
                  encoding='utf-8'
              )
          )

          site_key = (
              config
              .get('vars', {})
              .get('TURNSTILE_SITE_KEY', '')
          )

          if not site_key:
              raise SystemExit(
                  'TURNSTILE_SITE_KEY kosong.'
              )

          if (
              site_key
              == '1x00000000000000000000AA'
          ):
              raise SystemExit(
                  'Turnstile masih memakai test Site Key.'
              )

          print(
              'Turnstile Site Key:',
              site_key[:8]
              + '...'
              + site_key[-4:]
          )
          "

      - name: Run application QA
        shell: bash
        run: |
          set -euo pipefail
          npm run qa

      - name: Check Worker JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check src/index.js

      - name: Apply D1 migrations
        shell: bash
        run: |
          set -euo pipefail

          npx wrangler d1 migrations apply \
            voting-aifn2 \
            --remote

      - name: Upload shared ADMIN_KEY
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$ADMIN_KEY" |
            npx wrangler secret put ADMIN_KEY

      - name: Upload Turnstile Secret Key
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$TURNSTILE_SECRET_KEY" |
            npx wrangler secret put \
              TURNSTILE_SECRET_KEY

      - name: Deploy voting-aifn2 Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          npx wrangler deploy 2>&1 |
            tee wrangler-deploy.log

          WORKER_URL=$(
            grep -Eo \
              'https://[A-Za-z0-9.-]+\.workers\.dev' \
              wrangler-deploy.log |
            grep -v '\.preview\.' |
            head -n 1 || true
          )

          if [ -z "${WORKER_URL:-}" ]; then
            WORKER_URL="https://voting-aifn2.hicall.workers.dev"
          fi

          WORKER_URL="${WORKER_URL%/}"

          echo "worker_url=$WORKER_URL" \
            >> "$GITHUB_OUTPUT"

          echo ""
          echo "Production Worker URL:"
          echo "$WORKER_URL"

      - name: Verify deployment through Wrangler
        shell: bash
        run: |
          set -euo pipefail

          npx wrangler deployments list 2>&1 |
            tee wrangler-deployments.log

          if [ ! -s wrangler-deployments.log ]; then
            echo "::error::Wrangler tidak mengembalikan daftar deployment."
            exit 1
          fi

          echo "Deployment terdeteksi melalui Wrangler."

      - name: Optional workers.dev health check
        continue-on-error: true
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set +e

          echo "Pengecekan informatif:"
          echo "${WORKER_URL}/api/config"

          rm -f api-config.json

          HTTP_CODE=$(
            curl \
              --silent \
              --show-error \
              --location \
              --connect-timeout 10 \
              --max-time 30 \
              --retry 2 \
              --retry-delay 5 \
              --retry-all-errors \
              --output api-config.json \
              --write-out "%{http_code}" \
              --header "Accept: application/json" \
              --header "Cache-Control: no-cache" \
              --user-agent \
              "Voting-AiFn2-Health-Check/1.0" \
              "${WORKER_URL}/api/config"
          )

          CURL_EXIT=$?

          echo ""
          echo "curl exit code: $CURL_EXIT"
          echo "HTTP status: $HTTP_CODE"

          if [ -f api-config.json ]; then
            echo ""
            echo "Response:"
            cat api-config.json
            echo ""
          fi

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::warning::GitHub runner tidak dapat menjangkau workers.dev. Deployment tetap valid karena sudah diverifikasi melalui Wrangler."
            exit 0
          fi

          if [ "$HTTP_CODE" != "200" ]; then
            if grep -q \
              "error code: 1042" \
              api-config.json \
              2>/dev/null; then

              echo "::warning::Cloudflare workers.dev mengembalikan error 1042 sebelum request mencapai Worker. Deployment tetap dianggap berhasil."
              exit 0
            fi

            echo "::warning::Endpoint mengembalikan HTTP $HTTP_CODE. Periksa URL melalui browser."
            exit 0
          fi

          cat > validate_api.py <<'PYTHON'
          import json

          with open(
              "api-config.json",
              encoding="utf-8",
          ) as file:
              data = json.load(file)

          candidates = data.get(
              "candidates",
              [],
          )

          if len(candidates) != 38:
              raise SystemExit(
                  "Jumlah kandidat bukan 38."
              )

          if any(
              candidate.get("nim")
              == "25140200001"
              for candidate in candidates
          ):
              raise SystemExit(
                  "Mahasiswa Fast-Track masih terdaftar."
              )

          expected_deadline = (
              "2026-11-19T15:00:00.000Z"
          )

          if (
              data.get("deadline")
              != expected_deadline
          ):
              raise SystemExit(
                  "Deadline server tidak sesuai."
              )

          print(
              "Health check berhasil:",
              len(candidates),
              "kandidat eligible.",
          )
          PYTHON

          python3 validate_api.py
          exit 0

      - name: Show production URLs
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail

          echo "## Deployment AiFn2 berhasil" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- Halaman mahasiswa: ${WORKER_URL}" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- Halaman admin: ${WORKER_URL}/admin.html" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- API konfigurasi: ${WORKER_URL}/api/config" \
            >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "Halaman mahasiswa:"
          echo "$WORKER_URL"

          echo ""
          echo "Halaman admin:"
          echo "${WORKER_URL}/admin.html"

          echo ""
          echo "API konfigurasi:"
          echo "${WORKER_URL}/api/config"

      - name: Commit generated D1 configuration
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add wrangler.jsonc

          if git diff --cached --quiet; then
            echo "Tidak ada konfigurasi yang perlu disimpan."
          else
            git commit \
              -m "chore: configure AiFn2 Cloudflare D1"

            git push origin HEAD:main
          fi
