<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#132a4f"><link rel="manifest" href="/manifest.webmanifest"><title>Admin Voting AiFn2</title><style>:root{--n:#132a4f;--b:#285e9a;--a:#00aaa5;--bg:#f5f8fc;--c:#fff;--t:#172033;--m:#65748b;--l:#dbe5ef;--danger:#c83b3b;--sh:0 18px 48px rgba(19,42,79,.11)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 8% 4%,#00aaa51c,transparent 28%),radial-gradient(circle at 92% 12%,#285e9a20,transparent 34%),var(--bg);color:var(--t);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}header{background:linear-gradient(125deg,var(--n),var(--b));color:#fff;padding:24px;position:relative;overflow:hidden}header:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:#ffffff10;right:-55px;top:-115px;animation:float 9s ease-in-out infinite}.in,.wrap{max-width:1160px;margin:auto}.in{display:flex;justify-content:space-between;gap:18px;align-items:center;position:relative;z-index:1}.clock{text-align:right;font-variant-numeric:tabular-nums}.clock b{display:block;font-size:18px}.wrap{padding:16px}.card{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:20px;margin:14px 0;box-shadow:var(--sh);animation:rise .45s ease both}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.step{padding:10px;border-radius:11px;background:#eaf0f6;color:var(--m);font-weight:750;text-align:center}.step.on{background:linear-gradient(135deg,var(--a),#168bb0);color:#fff}.count{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.box{min-width:72px;text-align:center;padding:9px;background:#edf7f7;border-radius:12px}.box b{display:block;font-size:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:11px}.candidate{position:relative;border:2px solid var(--l);border-radius:14px;padding:14px;cursor:pointer;transition:.18s;background:linear-gradient(145deg,var(--c),#00aaa506)}.candidate:hover{transform:translateY(-3px);box-shadow:0 10px 24px #132a4f1d}.candidate:has(input:checked){border-color:var(--a);box-shadow:0 0 0 4px #00aaa52d}.candidate:has(input:checked):after{content:'✓';position:absolute;right:10px;top:9px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--a);color:#fff;animation:pop .25s}.toolbar,.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.actions{justify-content:flex-start}.chip{padding:8px 12px;border-radius:999px;background:#e8f8f7;color:#08716f;font-weight:750}.notice{padding:12px;border:1px solid #ecd58c;background:#fff7df;border-radius:12px}.muted{color:var(--m)}input,button{font:inherit;padding:10px 12px;border:1px solid #bccbd9;border-radius:9px}input[type=text],input[type=password],input[type=search]{width:100%}button{cursor:pointer;background:#fff;transition:.16s}.primary{background:linear-gradient(135deg,var(--a),#087f9d);color:#fff;border:0}.danger{background:linear-gradient(135deg,#d94b4b,#a92c2c);color:#fff;border:0}button:hover{transform:translateY(-2px);box-shadow:0 8px 18px #132a4f20}button:disabled{opacity:.5;cursor:not-allowed;transform:none}.success{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin:auto;background:linear-gradient(135deg,#35b96d,var(--a));color:#fff;font-size:40px;animation:pop .4s}.row{display:grid;grid-template-columns:250px 1fr 58px;gap:10px;align-items:center;padding:10px;margin:7px 0;border:1px solid var(--l);border-radius:11px}.bar{height:24px;background:#e7edf4;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),#4f8bd6);animation:grow .8s ease both}.audit{overflow:auto}.audit table{width:100%;border-collapse:collapse}.audit th,.audit td{padding:9px;border-bottom:1px solid var(--l);text-align:left;white-space:nowrap}.install{position:fixed;right:16px;bottom:16px;z-index:9}@keyframes rise{from{opacity:0;transform:translateY(18px)}}@keyframes pop{from{opacity:0;transform:scale(.45)}}@keyframes float{50%{transform:translate(-18px,14px)}}@keyframes grow{from{width:0}}@media(max-width:700px){.in{flex-direction:column;align-items:flex-start}.clock{text-align:left}.steps{grid-template-columns:1fr}.row{grid-template-columns:1fr}.wrap{padding:10px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media(prefers-color-scheme:dark){:root{--bg:#0f1722;--c:#172132;--t:#edf3fa;--m:#a8b3c3;--l:#334155}.step{background:#26364b}.box{background:#20364a}.notice{background:#3d321a;border-color:#66572d}.chip{background:#123e46;color:#9ce5df}.bar{background:#2a384c}}</style></head><body><header><div class="in"><div><h1>Dashboard Admin AiFn2</h1><p>Pantau partisipasi, audit pilihan, dan kelola putaran.</p></div><div class="clock"><span>Waktu server WIB</span><b id="clock">--:--:--</b></div></div></header><main class="wrap"><div class="card"><label><b>ADMIN_KEY</b></label><input id="key" type="password" placeholder="Masukkan ADMIN_KEY"><div class="actions"><button id="load" class="primary">Buka dashboard</button></div></div><div id="app"></div></main><script>let off=0;const E=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));setInterval(()=>clock.textContent=new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(Date.now()+off)),1000);async function api(method,body){let r=await fetch('/api/admin',{method,headers:{'content-type':'application/json','x-admin-key':key.value},body:body?JSON.stringify(body):null}),j=await r.json();if(!r.ok)throw Error(j.error);return j}async function draw(){try{let d=await api('GET');off=Date.parse(d.serverTime)-Date.now();app.innerHTML=`<div class="grid"><div class="card"><span class="muted">Eligible</span><h2>40</h2></div><div class="card"><span class="muted">Sesi diredeem</span><h2>${d.redeemed}</h2></div><div class="card"><span class="muted">Suara masuk</span><h2>${d.used}</h2></div><div class="card"><span class="muted">Partisipasi</span><h2>${(100*d.used/40).toFixed(1)}%</h2></div></div><div class="card"><div class="toolbar"><div><h2>Putaran ${d.round}</h2><span class="chip">${d.ended?'Berakhir otomatis':d.open?'Voting dibuka':'Voting ditutup'}</span></div><div class="actions"><button id="toggle" class="${d.open?'danger':'primary'}" ${d.ended?'disabled':''}>${d.open?'Tutup':'Buka'} voting</button>${d.tied.length>1&&d.tied[0].votes?'<button id="r2">Putaran kedua</button>':''}</div></div><div class="notice"><b>Deadline:</b> Kamis, 12 November 2026 pukul 22.00 WIB.</div><h3>Perolehan suara</h3>${d.results.map(x=>`<div class="row"><b>${E(x.name)}</b><div class="bar"><i style="width:${d.used?100*x.votes/d.used:0}%"></i></div><b>${x.votes}</b></div>`).join('')}<h3>Audit pemilih</h3><div class="audit"><table><thead><tr><th>Pemilih</th><th>NIM</th><th>Status</th><th>Pilihan</th><th>Waktu WIB</th></tr></thead><tbody>${d.audit.map(a=>`<tr><td>${E(a.voterName)}</td><td>${E(a.voterNim||'-')}</td><td>${E(a.status)}</td><td>${E(a.candidateName||'-')}</td><td>${a.submittedAt?new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',dateStyle:'medium',timeStyle:'medium'}).format(new Date(a.submittedAt)):'-'}</td></tr>`).join('')}</tbody></table></div><h3>Reset sesi NIM</h3><div class="actions"><input id="nim" placeholder="Masukkan NIM"><button id="reset">Reset sesi</button></div></div>`;toggle.onclick=()=>act({action:'setOpen',value:!d.manualOpen});reset.onclick=()=>confirm('Reset sesi NIM ini?')&&act({action:'resetNim',nim:nim.value.trim()});if(window.r2)r2.onclick=()=>confirm('Mulai putaran kedua?')&&act({action:'startRound2',candidates:d.tied.map(x=>x.nim)})}catch(e){alert(e.message)}}async function act(x){await api('POST',x);draw()}load.onclick=draw;</script></body></html>
