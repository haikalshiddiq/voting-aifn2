<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#132a4f"><meta name="description" content="Voting Ketua Kelas AiFn2"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/icon.svg"><title>Voting Ketua Kelas AiFn2</title><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script><style>:root{--n:#132a4f;--b:#285e9a;--a:#00aaa5;--bg:#f5f8fc;--c:#fff;--t:#172033;--m:#65748b;--l:#dbe5ef;--danger:#c83b3b;--sh:0 18px 48px rgba(19,42,79,.11)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 8% 4%,#00aaa51c,transparent 28%),radial-gradient(circle at 92% 12%,#285e9a20,transparent 34%),var(--bg);color:var(--t);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}header{background:linear-gradient(125deg,var(--n),var(--b));color:#fff;padding:24px;position:relative;overflow:hidden}header:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:#ffffff10;right:-55px;top:-115px;animation:float 9s ease-in-out infinite}.in,.wrap{max-width:1160px;margin:auto}.in{display:flex;justify-content:space-between;gap:18px;align-items:center;position:relative;z-index:1}.clock{text-align:right;font-variant-numeric:tabular-nums}.clock b{display:block;font-size:18px}.wrap{padding:16px}.card{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:20px;margin:14px 0;box-shadow:var(--sh);animation:rise .45s ease both}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.step{padding:10px;border-radius:11px;background:#eaf0f6;color:var(--m);font-weight:750;text-align:center}.step.on{background:linear-gradient(135deg,var(--a),#168bb0);color:#fff}.count{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.box{min-width:72px;text-align:center;padding:9px;background:#edf7f7;border-radius:12px}.box b{display:block;font-size:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:11px}.candidate{position:relative;border:2px solid var(--l);border-radius:14px;padding:14px;cursor:pointer;transition:.18s;background:linear-gradient(145deg,var(--c),#00aaa506)}.candidate:hover{transform:translateY(-3px);box-shadow:0 10px 24px #132a4f1d}.candidate:has(input:checked){border-color:var(--a);box-shadow:0 0 0 4px #00aaa52d}.candidate:has(input:checked):after{content:'✓';position:absolute;right:10px;top:9px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--a);color:#fff;animation:pop .25s}.toolbar,.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.actions{justify-content:flex-start}.chip{padding:8px 12px;border-radius:999px;background:#e8f8f7;color:#08716f;font-weight:750}.notice{padding:12px;border:1px solid #ecd58c;background:#fff7df;border-radius:12px}.muted{color:var(--m)}input,button{font:inherit;padding:10px 12px;border:1px solid #bccbd9;border-radius:9px}input[type=text],input[type=password],input[type=search]{width:100%}button{cursor:pointer;background:#fff;transition:.16s}.primary{background:linear-gradient(135deg,var(--a),#087f9d);color:#fff;border:0}.danger{background:linear-gradient(135deg,#d94b4b,#a92c2c);color:#fff;border:0}button:hover{transform:translateY(-2px);box-shadow:0 8px 18px #132a4f20}button:disabled{opacity:.5;cursor:not-allowed;transform:none}.success{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin:auto;background:linear-gradient(135deg,#35b96d,var(--a));color:#fff;font-size:40px;animation:pop .4s}.row{display:grid;grid-template-columns:250px 1fr 58px;gap:10px;align-items:center;padding:10px;margin:7px 0;border:1px solid var(--l);border-radius:11px}.bar{height:24px;background:#e7edf4;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),#4f8 ot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#24b36b;box-shadow:0 0 0 5px #24b36b20;margin-right:7px;animation:pulse 1.5s infinite}@keyframes pulse{50%{box-shadow:0 0 0 9px #24b36b08}}@media(max-width:700px){.result-row{grid-template-columns:1fr}.result-row strong{text-align:left!important}}@media(prefers-color-scheme:dark){.disclosure summary{background:#20364a}.result-bar{background:#2a384c}.winner{background:#3b341a;border-color:#a98528}}</style></head><body><header><div class="in"><div><h1>Voting Ketua Kelas AiFn2</h1><p>Artificial Intelligence in Finance · suara Anda menentukan koordinasi kelas.</p></div><div class="clock"><span>Waktu server WIB</span><b id="clock">--:--:--</b></div></div></header><main class="wrap"><div class="card"><b>Batas akhir: Kamis, 12 November 2026 · 22.00 WIB</b><div id="count" class="count"></div></div><section id="publicStatus" class="card"><h2><span class="live-dot"></span>Status partisipasi</h2><p class="muted">Memuat pembaruan terbaru...</p></section><div class="steps"><div id="s1" class="step on">1. Validasi NIM</div><div id="s2" class="step">2. Pilih kandidat</div><div id="s3" class="step">3. Selesai</div></div><section id="app" class="card"><h2>Menyiapkan voting...</h2></section></main><button id="install" class="primary install" hidden>Pasang aplikasi</button><script>let C,T=sessionStorage.getItem('aifn2Ballot')||'',S=JSON.parse(sessionStorage.getItem('aifn2Student')||'null'),W,off=0,hb,defer;const E=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(u,o){let r=await fetch(u,o),j=await r.json();if(!r.ok)throw Error(j.error);return j}function sync(t){off=Date.parse(t)-Date.now()}function tick(){let n=new Date(Date.now()+off);clock.textContent=new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(n);if(!C)return;let d=Math.max(0,Date.parse(C.deadline)-n),v=[['Hari',Math.floor(d/864e5)],['Jam',Math.floor(d/36e5)%24],['Menit',Math.floor(d/6e4)%60],['Detik',Math.floor(d/1e3)%60]];count.innerHTML=v.map(x=>`<div class="box"><b>${String(x[1]).padStart(2,'0')}</b>${x[0]}</div>`).join('')}setInterval(tick,1000);function steps(n){[s1,s2,s3].forEach((x,i)=>x.classList.toggle('on',i<n))}function ts(el,cb){let f=()=>W=turnstile.render(el,{sitekey:C.siteKey,callback:cb,theme:'auto'});window.turnstile?f():setTimeout(()=>ts(el,cb),200)}function clear(){sessionStorage.removeItem('aifn2Ballot');sessionStorage.removeItem('aifn2Student');T='';S=null;if(hb)clearInterval(hb)}async function beat(){if(!T)return;try{let x=await api('/api/heartbeat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:T})});if(!x.active){clear();redeem()}}catch(e){}}function startBeat(){if(hb)clearInterval(hb);hb=setInterval(beat,30000);beat()}function closeRelease(){if(T)navigator.sendBeacon('/api/logout',new Blob([JSON.stringify({token:T})],{type:'application/json'}))}addEventListener('pagehide',e=>{if(!e.persisted)closeRelease()});async function refreshPublic(){try{let x=await api('/api/public-status');sync(x.serverTime);if(x.phase==='open'){publicStatus.innerHTML=`<div class="toolbar"><div><h2><span class="live-dot"></span>Status partisipasi real-time</h2><p class="muted">Diperbarui otomatis setiap 15 detik sampai deadline.</p></div></div><div class="public-summary"><div class="metric"><span class="muted">Sudah memilih</span><b>${x.voted}</b></div><div class="metric"><span class="muted">Belum memilih</span><b>${x.pendingCount}</b></div><div class="metric"><span class="muted">Partisipasi</span><b>${(100*x.voted/x.totalEligible).toFixed(1)}%</b></div></div><details class="disclosure"><summary>Lihat mahasiswa yang belum memilih (${x.pendingCount})</summary><p class="muted">NIM disamarkan untuk menjaga privasi.</p><div class="pending-list">${x.pending.map(p=>`<div class="pending-item"><b>${E(p.name)}</b><br><small>${E(p.maskedNim)}</small></div>`).join('')||'<p>Semua mahasiswa telah memilih.</p>'}</div></details>`}else{let winnerText=x.tie?`Hasil seri: ${x.winners.map(w=>E(w.name)).join(', ')}`:x.winners.length?`Ketua kelas terpilih: ${E(x.winners[0].name)}`:'Belum ada suara';publicStatus.innerHTML=`<div class="toolbar"><div><h2>Hasil akhir voting</h2><p class="muted">Voting telah ditutup otomatis sesuai waktu server.</p></div><span class="chip">${winnerText}</span></div><div class="public-summary"><div class="metric"><span class="muted">Total suara</span><b>${x.totalVotes}</b></div><div class="metric"><span class="muted">Partisipasi</span><b>${(x.participation*100).toFixed(1)}%</b></div><div class="metric"><span class="muted">Status</span><b>${x.tie?'SERI':'FINAL'}</b></div></div><div>${x.results.map(r=>`<div class="result-row ${x.winners.some(w=>w.nim===r.nim)?'winner':''}"><b>${E(r.name)}</b><div class="result-bar"><i style="width:${r.percentage}%"></i></div><strong style="text-align:right">${r.votes} · ${r.percentage.toFixed(1)}%</strong></div>`).join('')}</div>`;if(C)C.open=false}}catch(e){publicStatus.innerHTML='<h2>Status partisipasi</h2><p class="muted">Pembaruan sementara tidak tersedia. Coba muat ulang halaman.</p>'}}setInterval(refreshPublic,15000);async function init(){C=await api('/api/config');sync(C.serverTime);tick();refreshPublic();if(!C.open&&!T)return app.innerHTML='<h2>Voting ditutup</h2><p class="muted">Batas waktu telah berakhir atau voting ditutup admin.</p>';T&&S?vote():redeem()}function redeem(){steps(1);app.innerHTML=`<h2>Validasi hak pilih</h2><p class="muted">Masukkan NIM AiFn2. Mahasiswa Fast-Track tidak termasuk pemilih maupun kandidat.</p><form id="f"><label><b>NIM mahasiswa</b></label><input id="nim" inputmode="numeric" maxlength="11" autocomplete="off" placeholder="Masukkan NIM" required><div id="turn"></div><div class="actions"><button class="primary" disabled>Validasi dan lanjut</button></div></form><p class="notice"><b>Transparansi:</b> admin dapat melihat siapa yang sudah memilih dan kandidat yang dipilih untuk audit kelas.</p>`;let z='';ts('#turn',x=>{z=x;f.querySelector('button').disabled=false});f.onsubmit=async e=>{e.preventDefault();try{let x=await api('/api/redeem',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({nim:nim.value.trim(),turnstileToken:z})});T=x.token;S=x.student;sessionStorage.setItem('aifn2Ballot',T);sessionStorage.setItem('aifn2Student',JSON.stringify(S));sync(x.serverTime);vote()}catch(x){alert(x.message);turnstile.reset(W)}}}async function logout(){if(!confirm('Batalkan sesi? Anda dapat masuk kembali selama belum mengirim suara.'))return;let b=document.getElementById('logout');b.disabled=true;b.textContent='Membatalkan...';try{await api('/api/logout',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:T})});clear();alert('Sesi berhasil dibatalkan.');redeem()}catch(x){b.disabled=false;b.textContent='Keluar & batalkan sesi';alert(x.message)}}function vote(){startBeat();steps(2);app.innerHTML=`<div class="toolbar"><div><h2>Pilih ketua kelas</h2><span class="chip">${E(S.name)} · ${E(S.nim)}</span></div><button id="logout" type="button" class="danger">Keluar & batalkan sesi</button></div><p class="muted">Pilih tepat satu kandidat. Verifikasi keamanan sudah dilakukan saat validasi NIM.</p><input id="search" type="search" placeholder="Cari nama atau NIM"><form id="f"><div id="grid" class="grid"></div><div class="actions"><button id="sendVote" type="submit" class="primary">Kirim suara</button></div></form>`;const draw=q=>grid.innerHTML=C.candidates.filter(c=>!q||c.name.toLowerCase().includes(q)||c.nim.includes(q)).map(c=>`<label class="candidate"><input type="radio" name="candidate" value="${c.nim}" required> <b>${E(c.name)}</b><br><small>${c.nim}</small></label>`).join('');draw('');search.oninput=e=>draw(e.target.value.toLowerCase());document.getElementById('logout').addEventListener('click',window.doLogout);f.onsubmit=async e=>{e.preventDefault();let nim=new FormData(f).get('candidate'),c=C.candidates.find(x=>x.nim===nim);if(!c)return alert('Pilih satu kandidat terlebih dahulu.');if(!confirm(`Konfirmasi pilihan:
${c.name}

Pilihan tidak dapat diubah.`))return;let b=document.getElementById('sendVote');b.disabled=true;b.textContent='Mengirim suara...';try{await api('/api/vote',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:T,candidateNim:nim})});clear();steps(3);app.innerHTML='<div class="success">✓</div><h2 style="text-align:center">Suara berhasil dicatat</h2><p class="muted" style="text-align:center">Terima kasih telah berpartisipasi.</p>';refreshPublic()}catch(x){b.disabled=false;b.textContent='Kirim suara';alert(x.message)}}}window.doLogout=logout;addEventListener('beforeinstallprompt',e=>{e.preventDefault();defer=e;install.hidden=false});install.onclick=async()=>{if(defer){defer.prompt();await defer.userChoice;defer=null;install.hidden=true}};if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js'));init().catch(x=>app.innerHTML=`<h2>Terjadi kendala</h2><p>${E(x.message)}</p>`);</script></body></html>
